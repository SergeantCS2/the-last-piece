# mpv settings for anime night, bundled with the viewer.
# Windows: %APPDATA%\mpv\mpv.conf    Linux/macOS: ~/.config/mpv/mpv.conf
# Every viewer can change any of this for themselves; nothing here is synced.

# Best-looking defaults on a decent GPU (mpv 0.37+; older builds: profile=gpu-hq).
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# Japanese audio and English subtitles when the file has them.
alang=jpn,ja,en,eng
slang=en,eng,enUS,en-US
sub-auto=fuzzy

# How loud people can go. The app passes its own value (Settings, "Loudest volume", up to
# 300%); this is for mpv started without the app. Past about 150% loud scenes can distort.
volume-max=130

# --- VLC look for plain text subtitles (SRT and similar) ---
# Styled ASS/SSA subtitles (most anime MKVs) ignore these and keep their own
# styling; VLC and mpv both draw those with libass.
# VLC 3 defaults on Windows (from VLC source): Arial, white, not bold, black
# outline, black shadow at 50% opacity toward the bottom right, text height
# about 6.25% of the video. The numbers below approximate that and still need a
# side-by-side screenshot check against VLC.
sub-font=Arial
sub-font-size=45
# Colors are r/g/b/alpha from 0 to 1. A '#' value would be read as a comment here.
sub-color=1.0/1.0/1.0/1.0
sub-bold=no
sub-outline-color=0.0/0.0/0.0/1.0
sub-outline-size=2.5
sub-border-style=outline-and-shadow
sub-back-color=0.0/0.0/0.0/0.5
sub-shadow-offset=2.5
