# Keys for the bundled mpv, closer to VLC and safer for watching together.
# Everything not listed keeps mpv's normal key (https://mpv.io/manual/master/#keyboard-control).
# Volume above 100% needs volume-max, which the app sets (130, 200 or 300 in Settings).

# Subtitles and audio: menus, plus VLC's cycle keys.
s       script-binding select/select-sid      # subtitle menu (mpv's normal "s" is a screenshot)
a       script-binding select/select-aid      # audio track menu
v       cycle sub                             # next subtitle track, like VLC
V       cycle sub down                        # previous subtitle track
b       cycle audio                           # next audio track, like VLC
Alt+v   cycle sub-visibility                  # hide or show subtitles

# Volume: mouse wheel and arrows change volume instead of seeking, so a stray key doesn't
# move the whole room (in Syncplay a seek moves everyone).
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5
UP           add volume 5
DOWN         add volume -5
Ctrl+UP      add volume 5
Ctrl+DOWN    add volume -5
m            cycle mute
