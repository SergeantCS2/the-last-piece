name: dotnet

on:
  push:
    # Pushing a tag like v0.3.0 also publishes a GitHub Release that installed apps update from.
    branches: ["**"]
    tags: ["v*"]
    paths: ["src/**", "tests/**", "viewer/**", "tools/package-viewer.ps1", "tools/make-installer.ps1", "TheLastPiece.sln", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "viewer/**", "tools/package-viewer.ps1", "tools/make-installer.ps1", "TheLastPiece.sln", ".github/workflows/dotnet.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build TheLastPiece.sln -c Release
      - run: dotnet test TheLastPiece.sln -c Release --no-build --logger "console;verbosity=normal"

  host-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the host image
        run: docker build -f src/Tlp.Host/Dockerfile -t the-last-piece/host:ci .
      - name: Start it and check the admin API answers
        run: |
          mkdir -p shelf && head -c 100000 /dev/urandom > "shelf/[Grp] Test - 01.mkv"
          docker run -d --name host -p 8080:8080 -e Tlp__AdminToken=ci-token \
            -v "$PWD/shelf:/shelf" the-last-piece/host:ci
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -H "Authorization: Bearer ci-token" localhost:8080/api/admin/shelf | tee shelf.json
          grep -q "Test - 01.mkv" shelf.json
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/admin/shelf)" = "401"
      - name: Host logs
        if: always()
        run: docker logs host

  viewer-zip:
    runs-on: windows-latest
    permissions:
      contents: write   # only used on a v* tag, to publish the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Package viewer (app + mpv + Syncplay)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/package-viewer.ps1 -Out dist
      - name: Check the zip has what the app looks for
        shell: pwsh
        run: |
          Expand-Archive dist/TheLastPiece-win-x64.zip -DestinationPath check
          foreach ($p in "TheLastPiece/TheLastPiece.exe","TheLastPiece/mpv/mpv.exe","TheLastPiece/mpv/portable_config/mpv.conf","TheLastPiece/syncplay/Syncplay.exe") {
            if (-not (Test-Path "check/$p")) { throw "missing $p" }
          }
          & check/TheLastPiece/mpv/mpv.exe --version
          # Syncplay looks for its portable syncplay.ini next to Syncplay.exe only if its code sits in lib/libsync.zip.
          if (-not (Test-Path "check/TheLastPiece/syncplay/lib/libsync.zip")) { Write-Warning "syncplay/lib/libsync.zip not found; the portable settings file may not be read" }
          Get-ChildItem check/TheLastPiece/syncplay | Select-Object Name, Length | Format-Table -AutoSize

      - name: Self-test the real exe (window, pack, torrent, Syncplay join)
        shell: pwsh
        run: |
          $app = Resolve-Path check/TheLastPiece
          # CI only: no screen or speakers for mpv.
          Add-Content "$app/mpv/portable_config/mpv.conf" "`nvo=null`nao=null"
          # A 10 minute silent test file for mpv to open (made with Python's standard library).
          python -c "import wave; w=wave.open('selftest.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(bytes(2*8000*600)); w.close()"
          if (-not (Test-Path selftest.wav)) { throw "could not make the test file" }
          # Syncplay's own server from the same download.
          $server = Get-ChildItem -Recurse -File "$app/syncplay" -Filter syncplayServer.exe | Select-Object -First 1
          if (-not $server) { throw "syncplayServer.exe isn't in the Syncplay download" }
          $srv = Start-Process $server.FullName -ArgumentList "--port","8999","--password","ci-pw" -PassThru -WindowStyle Hidden
          python tools/smoketest.py --host 127.0.0.1 --port 8999 --password ci-pw --room warmup --wait 60
          $env:TLP_SELFTEST_SYNCPLAY = "127.0.0.1:8999:ci-pw"
          $env:TLP_SELFTEST_MEDIA = "$PWD/selftest.wav"
          # WaitForExit on the app only; -Wait would also wait for the Syncplay it starts.
          $p = Start-Process "$app/TheLastPiece.exe" -ArgumentList "--self-test","$PWD/selftest-out" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test didn't finish in 3 minutes" }
          Get-Content selftest-out/self-test.txt
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          # Syncplay was started without its connect window; it should now be in the room with the file.
          python tools/smoketest.py --host 127.0.0.1 --port 8999 --password ci-pw --room ci --expect-user selftest --expect-file --wait 90
          Copy-Item "$app/syncplay/syncplay.ini" selftest-out/ -ErrorAction SilentlyContinue
          Get-Process Syncplay, mpv -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $srv.Id -Force

      - name: Installer (signed when signing is set up)
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $base = ([xml](Get-Content src/Tlp.Viewer/Tlp.Viewer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart("v") } else { "$base-ci.${{ github.run_number }}" }
          "VERSION=$version" >> $env:GITHUB_ENV
          pwsh tools/make-installer.ps1 -Version $version

      - name: Install, check and uninstall with the real Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer -Filter *Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no Setup.exe was made" }
          $p = Start-Process $setup.FullName -ArgumentList "--silent" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "Setup.exe didn't finish in 3 minutes" }
          Start-Sleep 5
          Get-Process TheLastPiece -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path $env:LOCALAPPDATA "TheLastPiece"
          Get-ChildItem $app | Select-Object Name | Format-Table -AutoSize
          foreach ($f in "current/TheLastPiece.exe", "current/mpv/mpv.exe", "current/syncplay/Syncplay.exe", "Update.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "installed copy is missing $f" }
          }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\tlp\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "tlp:// opens: $cmd"
          if ($cmd -notlike "*TheLastPiece\current\TheLastPiece.exe*") { throw "the install hook didn't register tlp:// links" }
          $u = Start-Process (Join-Path $app "Update.exe") -ArgumentList "uninstall","--silent" -PassThru
          if (-not $u.WaitForExit(120000)) { throw "uninstall didn't finish" }
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\tlp") { throw "uninstall left the tlp:// registration behind" }
          if (Test-Path (Join-Path $app "current/TheLastPiece.exe")) { throw "uninstall left the app behind" }
          Write-Host "Install and uninstall: ok"

      - uses: actions/upload-artifact@v4
        with:
          name: TheLastPiece-installer
          path: dist/installer/

      - name: Publish the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir dist/installer --tag "${{ github.ref_name }}" --releaseName "The Last Piece $env:VERSION" --publish

      - name: Self-test output (window picture and log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-self-test
          path: selftest-out/

      - uses: actions/upload-artifact@v4
        with:
          name: TheLastPiece-win-x64
          path: dist/TheLastPiece-win-x64.zip
