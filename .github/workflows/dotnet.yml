name: dotnet

on:
  push:
    # Pushing a tag like v0.3.0 also publishes a GitHub Release that installed apps update from.
    branches: ["**"]
    tags: ["v*"]
    paths: ["src/**", "tests/**", "viewer/**", "tools/package-viewer.ps1", "tools/make-installer.ps1", "server/windows-network.ps1", "Directory.Build.props", "TheLastPiece.sln", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "viewer/**", "tools/package-viewer.ps1", "tools/make-installer.ps1", "server/windows-network.ps1", "Directory.Build.props", "TheLastPiece.sln", ".github/workflows/dotnet.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build TheLastPiece.sln -c Release
      - run: dotnet test TheLastPiece.sln -c Release --no-build --logger "console;verbosity=normal"

  host-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the host image
        run: docker build -f src/Tlp.Host/Dockerfile -t the-last-piece/host:ci .
      - name: Start it and check the admin API answers
        run: |
          mkdir -p shelf && head -c 100000 /dev/urandom > "shelf/[Grp] Test - 01.mkv"
          docker run -d --name host -p 8080:8080 -e Tlp__AdminToken=ci-token \
            -v "$PWD/shelf:/shelf" the-last-piece/host:ci
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -H "Authorization: Bearer ci-token" localhost:8080/api/admin/shelf | tee shelf.json
          grep -q "Test - 01.mkv" shelf.json
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/admin/shelf)" = "401"
      - name: Host logs
        if: always()
        run: docker logs host

  viewer-zip:
    runs-on: windows-latest
    permissions:
      contents: write   # only used on a v* tag, to publish the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Package viewer (app + mpv + Syncplay)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/package-viewer.ps1 -Out dist
      - name: Check the zip has what the app looks for
        shell: pwsh
        run: |
          Expand-Archive dist/TheLastPiece-win-x64.zip -DestinationPath check
          foreach ($p in "TheLastPiece/TheLastPiece.exe","TheLastPiece/mpv/mpv.exe","TheLastPiece/mpv/portable_config/mpv.conf","TheLastPiece/mpv/portable_config/input.conf","TheLastPiece/syncplay/Syncplay.exe") {
            if (-not (Test-Path "check/$p")) { throw "missing $p" }
          }
          & check/TheLastPiece/mpv/mpv.exe --version
          # Syncplay looks for its portable syncplay.ini next to Syncplay.exe only if its code sits in lib/libsync.zip.
          if (-not (Test-Path "check/TheLastPiece/syncplay/lib/libsync.zip")) { Write-Warning "syncplay/lib/libsync.zip not found; the portable settings file may not be read" }
          Get-ChildItem check/TheLastPiece/syncplay | Select-Object Name, Length | Format-Table -AutoSize

      - name: Bundled mpv reads our settings and keys without errors
        shell: pwsh
        run: |
          $app = Resolve-Path check/TheLastPiece
          # A 10 minute silent test file for mpv to open (made with Python's standard library).
          python -c "import wave; w=wave.open('selftest.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(bytes(2*8000*600)); w.close()"
          if (-not (Test-Path selftest.wav)) { throw "could not make the test file" }
          # mpv.exe started without a console uses its "pseudo-gui" profile, so say plainly to quit at the end.
          $mpvArgs = "--vo=null","--ao=null","--idle=no","--force-window=no","--keep-open=no","--end=2","--volume-max=300","--volume=250","--log-file=$PWD/mpv-check.log","$PWD/selftest.wav"
          $p = Start-Process "$app/mpv/mpv.exe" -ArgumentList $mpvArgs -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(30000)) { $p.Kill(); Write-Host "::warning::mpv didn't quit by itself; checking its log anyway" }
          Start-Sleep 1
          $log = Get-Content mpv-check.log
          Write-Host "--- last lines of mpv's log ---"; $log | Select-Object -Last 25
          ($log | Select-String -SimpleMatch "mpv v" | Select-Object -First 1).Line
          $bad = $log | Select-String -Pattern "(input\.conf|mpv\.conf|\[input\]|option).*(error|unknown|not found|invalid|failed)" 
          if ($bad) { $bad | ForEach-Object { $_.Line }; throw "mpv complained about our mpv.conf or input.conf" }
          if (-not ($log | Select-String -SimpleMatch "select.lua")) { throw "this mpv build has no select.lua, so the S and A menus won't work" }
          if (-not ($log | Select-String -SimpleMatch "input.conf")) { throw "mpv didn't load our input.conf" }
          Write-Host "mpv settings and keys: ok"

      - name: Self-test the real exe (window, pack, torrent, Syncplay join)
        shell: pwsh
        run: |
          $app = Resolve-Path check/TheLastPiece
          # CI only: no screen or speakers for mpv.
          Add-Content "$app/mpv/portable_config/mpv.conf" "`nvo=null`nao=null"
          # Syncplay's own server from the same download.
          $server = Get-ChildItem -Recurse -File "$app/syncplay" -Filter syncplayServer.exe | Select-Object -First 1
          if (-not $server) { throw "syncplayServer.exe isn't in the Syncplay download" }
          $srv = Start-Process $server.FullName -ArgumentList "--port","8999","--password","ci-pw" -PassThru -WindowStyle Hidden
          python tools/smoketest.py --host 127.0.0.1 --port 8999 --password ci-pw --room warmup --wait 60
          $env:TLP_SELFTEST_SYNCPLAY = "127.0.0.1:8999:ci-pw"
          $env:TLP_SELFTEST_MEDIA = "$PWD/selftest.wav"
          # WaitForExit on the app only; -Wait would also wait for the Syncplay it starts.
          $p = Start-Process "$app/TheLastPiece.exe" -ArgumentList "--self-test","$PWD/selftest-out" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test didn't finish in 3 minutes" }
          Get-Content selftest-out/self-test.txt
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          # Syncplay was started without its connect window; it should now be in the room with the file.
          python tools/smoketest.py --host 127.0.0.1 --port 8999 --password ci-pw --room ci --expect-user selftest --expect-file --wait 90
          # The app's player choices reach mpv through Syncplay.
          $mpvCmd = (Get-CimInstance Win32_Process -Filter "Name='mpv.exe'" | Select-Object -First 1).CommandLine
          Write-Host "mpv started as: $mpvCmd"
          if ($mpvCmd -notlike "*volume-max=300*") { throw "mpv wasn't given the app's volume setting" }
          Copy-Item "$app/syncplay/syncplay.ini" selftest-out/ -ErrorAction SilentlyContinue
          Get-Process Syncplay, mpv -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $srv.Id -Force

      - name: Installer (signed when signing is set up)
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $base = ([xml](Get-Content src/Tlp.Viewer/Tlp.Viewer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".TrimStart("v") } else { "$base-ci.${{ github.run_number }}" }
          "VERSION=$version" >> $env:GITHUB_ENV
          pwsh tools/make-installer.ps1 -Version $version

      - name: Install, update, check and uninstall with the real Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer -Filter *Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no Setup.exe was made" }
          $p = Start-Process $setup.FullName -ArgumentList "--silent" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "Setup.exe didn't finish in 3 minutes" }
          Start-Sleep 5
          Get-Process TheLastPiece -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path $env:LOCALAPPDATA "TheLastPiece"
          Get-ChildItem $app | Select-Object Name | Format-Table -AutoSize
          foreach ($f in "current/TheLastPiece.exe", "current/mpv/mpv.exe", "current/syncplay/Syncplay.exe", "Update.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "installed copy is missing $f" }
          }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\tlp\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "tlp:// opens: $cmd"
          if ($cmd -notlike "*TheLastPiece\current\TheLastPiece.exe*") { throw "the install hook didn't register tlp:// links" }
          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $links = @(Get-ChildItem $startMenu, ([Environment]::GetFolderPath("Desktop")) -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Last Piece*" })
          $links | ForEach-Object { Write-Host "shortcut: $($_.FullName)" }
          if (-not ($links | Where-Object { $_.FullName -like "$startMenu*" })) { throw "the install made no Start menu entry" }

          # Update path, without publishing a release: a newer package goes in a local folder, the
          # installed app finds and downloads it the way it would from GitHub, and Velopack installs it.
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "can't read version $env:VERSION" }
          $v2 = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)-updatetest.${{ github.run_number }}"
          pwsh tools/make-installer.ps1 -Version $v2 -Out dist/update-feed
          $feed = (Resolve-Path dist/update-feed).Path
          $log = Join-Path $env:RUNNER_TEMP "update-test.txt"
          $p = Start-Process (Join-Path $app "current/TheLastPiece.exe") -ArgumentList "--update-from", $feed, $log -PassThru
          if (-not $p.WaitForExit(180000)) { throw "the update check didn't finish in 3 minutes" }
          Get-Content $log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "the installed app didn't find or download the update (exit $($p.ExitCode))" }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep 3
            $ver = (Select-Xml -Path (Join-Path $app "current/sq.version") -XPath "//*[local-name()='version']" -ErrorAction SilentlyContinue).Node.InnerText
          } until ($ver -eq $v2 -or (Get-Date) -gt $deadline)
          Get-Process TheLastPiece -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($ver -ne $v2) { Get-ChildItem $app -Recurse -Depth 1 | Select-Object FullName | Format-Table -AutoSize; throw "installed version is '$ver', expected $v2 after the update" }
          if (-not (Test-Path (Join-Path $app "current/mpv/mpv.exe"))) { throw "the update lost the bundled mpv" }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\tlp\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          if ($cmd -notlike "*TheLastPiece\current\TheLastPiece.exe*") { throw "tlp:// links weren't registered after the update" }
          Write-Host "Update from $env:VERSION to ${v2}: ok"
          $u = Start-Process (Join-Path $app "Update.exe") -ArgumentList "uninstall","--silent" -PassThru
          if (-not $u.WaitForExit(120000)) { throw "uninstall didn't finish" }
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\tlp") { throw "uninstall left the tlp:// registration behind" }
          if (Test-Path (Join-Path $app "current/TheLastPiece.exe")) { throw "uninstall left the app behind" }
          $left = @(Get-ChildItem $startMenu, ([Environment]::GetFolderPath("Desktop")) -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Last Piece*" })
          if ($left) { $left | ForEach-Object { Write-Host "left behind: $($_.FullName)" }; throw "uninstall left shortcuts behind" }
          Write-Host "Install and uninstall: ok"

      - name: WSL network helper sets up and undoes cleanly
        shell: pwsh
        run: |
          $ps = "server/windows-network.ps1"
          $profileDir = Join-Path $env:RUNNER_TEMP "wslprofile"; New-Item -ItemType Directory $profileDir -Force | Out-Null
          $result = Join-Path $env:RUNNER_TEMP "wslnet.txt"
          function Run([string[]] $more) {
            powershell -NoProfile -ExecutionPolicy Bypass -File $ps -UserProfile $profileDir -ResultFile $result @more
            $text = Get-Content $result -Raw; Write-Host "-> $text"
            if ($text -notlike "ok*") { throw "windows-network.ps1 $more failed: $text" }
          }
          function OurRules { @(Get-NetFirewallRule -Group "The Last Piece" -ErrorAction SilentlyContinue) }

          # Port forwarding: firewall rules and forwards appear, and a second run doesn't double them.
          Run @("-Mode", "PortProxy", "-WslAddress", "127.0.0.2")
          Run @("-Mode", "PortProxy", "-WslAddress", "127.0.0.2")
          if ((OurRules).Count -ne 4) { throw "expected 4 firewall rules, found $((OurRules).Count)" }
          $proxy = netsh interface portproxy show v4tov4 | Out-String; Write-Host $proxy
          foreach ($p in 8080, 8999, 6890) { if ($proxy -notmatch "\b$p\s+127\.0\.0\.2\s+$p\b") { throw "port $p isn't forwarded" } }
          Run @("-Undo")
          if ((OurRules).Count) { throw "undo left firewall rules" }
          if ((netsh interface portproxy show v4tov4 | Out-String) -match "127\.0\.0\.2") { throw "undo left port forwards" }

          # Mirrored: .wslconfig keeps what was there, gains the two settings, and comes back on undo.
          $cfg = Join-Path $profileDir ".wslconfig"
          Set-Content $cfg "[wsl2]`nmemory=4GB`nnetworkingMode=nat`n`n[experimental]`nautoMemoryReclaim=gradual"
          $before = Get-Content $cfg -Raw
          Run @("-Mode", "Mirrored")
          $after = Get-Content $cfg -Raw; Write-Host $after
          if ($after -notmatch "memory=4GB" -or $after -notmatch "autoMemoryReclaim=gradual") { throw ".wslconfig lost existing settings" }
          if ($after -notmatch "networkingMode=mirrored" -or $after -match "networkingMode=nat") { throw ".wslconfig networkingMode not set" }
          if ($after -notmatch "hostAddressLoopback=true") { throw ".wslconfig hostAddressLoopback not set" }
          Run @("-Undo")
          if ((Get-Content $cfg -Raw) -ne $before) { throw "undo didn't put .wslconfig back" }
          if ((OurRules).Count) { throw "undo left firewall rules" }

          # With no .wslconfig at first, undo removes the one it made.
          Remove-Item $cfg
          Run @("-Mode", "Mirrored")
          Run @("-Undo")
          if (Test-Path $cfg) { throw "undo left a .wslconfig it made" }
          Write-Host "WSL network helper: ok"

      - uses: actions/upload-artifact@v4
        with:
          name: TheLastPiece-installer
          path: dist/installer/

      - name: Publish the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $name = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.AppDisplayName | Where-Object { $_ } | Select-Object -First 1
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir dist/installer --tag "${{ github.ref_name }}" --releaseName "$name $env:VERSION" --publish --pre --merge

      - name: Self-test output (window picture and log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-self-test
          path: selftest-out/

      - uses: actions/upload-artifact@v4
        with:
          name: TheLastPiece-win-x64
          path: dist/TheLastPiece-win-x64.zip
