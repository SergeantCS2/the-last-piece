<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- A, the piece: neon circuit (cyberpunk). Our own drawing. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C7A"/><stop offset="1" stop-color="#8E4BFF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241634"/><stop offset="1" stop-color="#110B1C"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFC4D2"/>
    </linearGradient>
    <clipPath id="inside"><path id="p" d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z"/></clipPath>
  </defs>
  <!-- glow: wide faint strokes behind the edge -->
  <path d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z" fill="none" stroke="#FF5C7A" stroke-opacity="0.10" stroke-width="9" stroke-linejoin="round"/>
  <path d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z" fill="none" stroke="#B04CFF" stroke-opacity="0.16" stroke-width="5.5" stroke-linejoin="round"/>
  <!-- body -->
  <path d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z" fill="url(#body)"/>
  <g clip-path="url(#inside)">
    <!-- scanlines -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.6">
      <path d="M10,24 H90 M10,28 H90 M10,32 H90 M10,36 H90 M10,40 H90 M10,44 H90 M10,48 H90 M10,52 H90 M10,56 H90 M10,60 H90 M10,64 H90 M10,68 H90 M10,72 H90 M10,76 H90"/>
    </g>
    <!-- circuit traces -->
    <g fill="none" stroke="#22E5F0" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
      <path d="M50,13 V22 L44,28 H32"/>
      <path d="M86,50 H76 L71,45 V33"/>
      <path d="M26,50 H30 L34,54 V68"/>
      <path d="M58,75 H66 L71,70"/>
    </g>
    <g fill="#22E5F0">
      <circle cx="32" cy="28" r="1.7"/><circle cx="71" cy="33" r="1.7"/>
      <circle cx="34" cy="68" r="1.7"/><circle cx="71" cy="70" r="1.7"/>
    </g>
    <!-- hazard band along the bottom edge -->
    <g fill="#F3E600">
      <path d="M22,80 L25,76 H28 L25,80 Z M28,80 L31,76 H34 L31,80 Z M34,80 L37,76 H40 L37,80 Z M40,80 L43,76 H46 L43,80 Z"/>
    </g>
  </g>
  <!-- chromatic split of the edge -->
  <path transform="translate(-1.3,0)" d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z" fill="none" stroke="#22E5F0" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- edge -->
  <path d="M20,27 L27,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V73 L73,80 H20 V60 A10,10 0 1,0 20,40 Z" fill="none" stroke="url(#edge)" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- corner marks -->
  <g fill="none" stroke="#F3E600" stroke-width="1.4" stroke-linecap="square">
    <path d="M14,32 V26 L21,19"/>
    <path d="M86,68 V74 L79,81"/>
  </g>
  <!-- play button with glow -->
  <path d="M42,37 L64,50 L42,63 Z" fill="#FF5C7A" fill-opacity="0.18" stroke="#FF5C7A" stroke-opacity="0.22" stroke-width="5" stroke-linejoin="round"/>
  <path d="M42,37 L64,50 L42,63 Z" fill="url(#play)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
</svg>
