<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- A, the piece: retro terminal plate (riveted steel, amber screen). Our own drawing.
       The screen sits clear of the left notch and the plate's edges, with even steel around it. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8E8B80"/><stop offset="0.5" stop-color="#626057"/><stop offset="1" stop-color="#3A3833"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121110"/><stop offset="1" stop-color="#2A2925"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C1B06"/><stop offset="1" stop-color="#140C03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#FFB641" stop-opacity="0.32"/><stop offset="1" stop-color="#FFB641" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scr"><rect x="37" y="34" width="32" height="32" rx="5"/></clipPath>
  </defs>
  <!-- plate -->
  <path d="M20,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V80 H20 V60 A10,10 0 1,0 20,40 Z"
        fill="url(#steel)" stroke="#1C1B18" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- inset line that follows the plate's shape, like a pressed panel -->
  <path transform="translate(50,50) scale(0.88) translate(-50,-50)"
        d="M20,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V80 H20 V60 A10,10 0 1,0 20,40 Z"
        fill="none" stroke="#2A2925" stroke-opacity="0.55" stroke-width="0.9" stroke-linejoin="round"/>
  <path transform="translate(50.5,50.6) scale(0.88) translate(-50,-50)"
        d="M20,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V80 H20 V60 A10,10 0 1,0 20,40 Z"
        fill="none" stroke="#C7C3B4" stroke-opacity="0.35" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- rivets in the four corners -->
  <g>
    <circle cx="25.5" cy="25.5" r="1.9" fill="#26251F"/><circle cx="25.1" cy="25.1" r="1.15" fill="#BDB9AA"/>
    <circle cx="74.5" cy="25.5" r="1.9" fill="#26251F"/><circle cx="74.1" cy="25.1" r="1.15" fill="#BDB9AA"/>
    <circle cx="25.5" cy="74.5" r="1.9" fill="#26251F"/><circle cx="25.1" cy="74.1" r="1.15" fill="#BDB9AA"/>
    <circle cx="74.5" cy="74.5" r="1.9" fill="#26251F"/><circle cx="74.1" cy="74.1" r="1.15" fill="#BDB9AA"/>
  </g>
  <!-- screen: bezel, lip highlight, glass -->
  <rect x="34" y="31" width="38" height="38" rx="7.5" fill="url(#bezel)"/>
  <rect x="34.5" y="31.5" width="37" height="37" rx="7" fill="none" stroke="#9C988A" stroke-opacity="0.35" stroke-width="0.6"/>
  <rect x="37" y="34" width="32" height="32" rx="5" fill="url(#screen)"/>
  <g clip-path="url(#scr)">
    <rect x="37" y="34" width="32" height="32" fill="url(#glow)"/>
    <g stroke="#000000" stroke-opacity="0.35" stroke-width="0.6">
      <path d="M37,35.5 H69 M37,37.7 H69 M37,39.9 H69 M37,42.1 H69 M37,44.3 H69 M37,46.5 H69 M37,48.7 H69 M37,50.9 H69 M37,53.1 H69 M37,55.3 H69 M37,57.5 H69 M37,59.7 H69 M37,61.9 H69 M37,64.1 H69"/>
    </g>
    <path d="M37,34 H55 L43,66 H37 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  </g>
  <!-- amber play button with glow, centred on the screen -->
  <path d="M47,42 L61,50 L47,58 Z" fill="#FFB641" fill-opacity="0.18" stroke="#FFB641" stroke-opacity="0.22" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M47,42 L61,50 L47,58 Z" fill="#FFB641"/>
  <!-- cursor -->
  <rect x="62" y="61" width="3.4" height="1.8" fill="#FFB641"/>
  <!-- status lamp on the top knob -->
  <circle cx="50" cy="13.5" r="2.9" fill="#26251F"/><circle cx="50" cy="13.5" r="1.85" fill="#FF6B3D"/>
  <circle cx="49.4" cy="12.9" r="0.55" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- grille slots on the right knob -->
  <g stroke="#26251F" stroke-width="1.2" stroke-linecap="round">
    <path d="M85,46.5 H88.5 M85,50 H88.5 M85,53.5 H88.5"/>
  </g>
</svg>
