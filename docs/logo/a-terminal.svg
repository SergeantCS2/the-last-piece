<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- A, the piece: retro terminal plate (riveted steel, amber screen). Our own drawing. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8A877C"/><stop offset="0.45" stop-color="#5E5B52"/><stop offset="1" stop-color="#34322D"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1A06"/><stop offset="1" stop-color="#120B03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFB641" stop-opacity="0.35"/><stop offset="1" stop-color="#FFB641" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scr"><rect x="30" y="31" width="40" height="38" rx="6"/></clipPath>
  </defs>
  <!-- plate -->
  <path d="M20,20 H40 A10,10 0 1,1 60,20 H80 V40 A10,10 0 1,1 80,60 V80 H20 V60 A10,10 0 1,0 20,40 Z" fill="url(#steel)" stroke="#1E1D1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- bevel highlight -->
  <path d="M22.5,77.5 V60.8 M22.5,39.2 V22.5 H40.8 M59.2,22.5 H77.5 V40.8" fill="none" stroke="#C9C5B6" stroke-opacity="0.55" stroke-width="1"/>
  <!-- rivets -->
  <g>
    <circle cx="26" cy="26" r="2.1" fill="#2B2A26"/><circle cx="25.5" cy="25.5" r="1.3" fill="#B7B3A4"/>
    <circle cx="74" cy="26" r="2.1" fill="#2B2A26"/><circle cx="73.5" cy="25.5" r="1.3" fill="#B7B3A4"/>
    <circle cx="26" cy="74" r="2.1" fill="#2B2A26"/><circle cx="25.5" cy="73.5" r="1.3" fill="#B7B3A4"/>
    <circle cx="74" cy="74" r="2.1" fill="#2B2A26"/><circle cx="73.5" cy="73.5" r="1.3" fill="#B7B3A4"/>
  </g>
  <!-- screen bezel and glass -->
  <rect x="28" y="29" width="44" height="42" rx="7.5" fill="#1A1915"/>
  <rect x="30" y="31" width="40" height="38" rx="6" fill="url(#screen)"/>
  <g clip-path="url(#scr)">
    <rect x="30" y="31" width="40" height="38" fill="url(#glow)"/>
    <g stroke="#000000" stroke-opacity="0.35" stroke-width="0.7">
      <path d="M30,32.5 H70 M30,35 H70 M30,37.5 H70 M30,40 H70 M30,42.5 H70 M30,45 H70 M30,47.5 H70 M30,50 H70 M30,52.5 H70 M30,55 H70 M30,57.5 H70 M30,60 H70 M30,62.5 H70 M30,65 H70 M30,67.5 H70"/>
    </g>
    <!-- glass reflection -->
    <path d="M30,31 H52 L36,69 H30 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  </g>
  <!-- amber play button with glow -->
  <path d="M43,40 L60,50 L43,60 Z" fill="#FFB641" fill-opacity="0.2" stroke="#FFB641" stroke-opacity="0.25" stroke-width="4" stroke-linejoin="round"/>
  <path d="M43,40 L60,50 L43,60 Z" fill="#FFB641"/>
  <!-- cursor -->
  <rect x="62.5" y="62" width="4" height="2" fill="#FFB641"/>
  <!-- status lamp on the knob -->
  <circle cx="50" cy="13.5" r="3" fill="#2B2A26"/><circle cx="50" cy="13.5" r="1.9" fill="#FF6B3D"/>
  <circle cx="49.4" cy="12.9" r="0.6" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
