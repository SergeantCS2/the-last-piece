# Movie night host: the host app (shelf, links, cleanup, admin page) and the
# Syncplay server. Run from this folder.
#
#   docker compose up -d --build                  -> host app on :8080, Syncplay on :8999
#   docker compose --profile https up -d --build  -> plus Caddy with automatic HTTPS on :443
#
# First admin login: the token is printed in `docker compose logs host`
# (or set TLP_ADMIN_TOKEN in .env).
services:
  host:
    build:
      context: ..
      dockerfile: src/Tlp.Host/Dockerfile
    image: the-last-piece/host:dev
    restart: unless-stopped
    ports:
      - "${TLP_HTTP_PORT:-8080}:8080"
    environment:
      Tlp__PublicBaseUrl: ${TLP_PUBLIC_URL:-http://localhost:8080}
      Tlp__AdminToken: ${TLP_ADMIN_TOKEN:-}
      Tlp__RetentionDays: ${TLP_RETENTION_DAYS:-7}
      Tlp__Syncplay__PublicHost: ${SYNCPLAY_PUBLIC_HOST:-}
      Tlp__Syncplay__Password: ${SYNCPLAY_PASSWORD:-}
      Tlp__Syncplay__DefaultRoom: ${SYNCPLAY_ROOM:-movienight}
      Tlp__DiscordWebhookUrl: ${TLP_DISCORD_WEBHOOK:-}
      Tlp__BehindProxy: ${TLP_BEHIND_PROXY:-false}
      Tlp__GroupTorrents: ${TLP_GROUP_TORRENTS:-true}
    volumes:
      # Read-write so cleanup can delete old episodes. Put tonight's files here.
      - ${SHELF_DIR:-./shelf}:/shelf
      - host-data:/data

  syncplay:
    build: .
    image: the-last-piece/syncplay-server:1.7.6
    restart: unless-stopped
    ports:
      - "8999:8999"
    env_file: .env
    environment:
      SYNCPLAY_ROOMS_DB: /data/rooms.db
      SYNCPLAY_PERMANENT_ROOMS: /config/permanent-rooms.txt
      SYNCPLAY_MOTD_FILE: /config/motd.txt
      # Uncomment once you have certs (privkey.pem, cert.pem, chain.pem):
      # SYNCPLAY_TLS_DIR: /certs
    volumes:
      - syncplay-data:/data
      - ./motd.txt:/config/motd.txt:ro
      - ./permanent-rooms.txt:/config/permanent-rooms.txt:ro
      # - /etc/letsencrypt/live/sync.example.com:/certs:ro

  https:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLP_DOMAIN: ${TLP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  host-data:
  syncplay-data:
  caddy-data:
